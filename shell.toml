# Rundfunk shell surface overrides (colors/layout accents only; bar layout is preserved)

[bar]
background       = "#101216"
background-alpha = 0.96
text             = "#D6B45A"
active           = "#ff5c7a"

[hyprland]
active-border            = "rgba(214,180,90,0.93)"
active-border-foreground = "#D6B45A"

[popups]
background       = "#101216"
background-alpha = 0.98
text             = "#d7dde8"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 1

[tooltip]
background       = "#101216"
background-alpha = 0.97
text             = "#d7dde8"
border           = "hyprland.active-border-foreground"
border-alpha     = 1.0
border-width     = 1

[notifications]
background       = "#101216"
background-alpha = 0.98
text             = "#d7dde8"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 1
countdown        = "#59d9e6"

[launcher]
background                = "#101216"
background-alpha          = 0.96
text                      = "#d7dde8"
border                    = "hyprland.active-border-foreground"
border-alpha              = 1.0
border-width              = 1
scrim                     = "#07090b"
scrim-alpha               = 0.55
selected-background       = "#26313d"
selected-background-alpha = 0.55
selected-text             = "#e8f7ff"
selected-border           = "hyprland.active-border"
selected-border-alpha     = 0.65
selected-border-width     = 1

[menu]
background                = "#101216"
background-alpha          = 0.98
text                      = "#d7dde8"
border                    = "hyprland.active-border-foreground"
border-alpha              = 1.0
border-width              = 1
scrim                     = "#07090b"
scrim-alpha               = 0.55
selected-background       = "#26313d"
selected-background-alpha = 0.55
selected-text             = "#e8f7ff"
selected-border           = "hyprland.active-border"
selected-border-alpha     = 0.65
selected-border-width     = 1

[polkit]
background       = "#101216"
background-alpha = 0.98
text             = "#d7dde8"
text-error       = "#ff5c7a"
border           = "hyprland.active-border"
border-error     = "#ff5c7a"
border-alpha     = 1.0
border-width     = 1
scrim            = "#07090b"
scrim-alpha      = 0.55
accent           = "#59d9e6"

[lock]
background       = "#101216"
background-alpha = 0.82
text             = "#d7dde8"
placeholder      = "#8b98aa"
text-error       = "#ff5c7a"
border           = "hyprland.active-border"
border-active    = "hyprland.active-border"
border-error     = "#ff5c7a"
border-alpha     = 1.0
border-width     = 1
selection        = "#59d9e6"
selection-alpha  = 0.40
